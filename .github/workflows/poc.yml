name: verify-poc

on:
  workflow_dispatch:
  push:

jobs:
  verify-sandbox-read-escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run PoC
        run: |
          set -o pipefail
          bash poc/run_poc.sh 2>&1 | tee poc_result.txt
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-result
          path: poc_result.txt
          if-no-files-found: warn
